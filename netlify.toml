[build]
  # Build the site once into the publish dir, then run the suite. The build-html
  # smoke test would otherwise compile a second throwaway copy; SMOKE_BUILD_REUSE_DIR
  # points it at the dist we just built so a deploy compiles the site only once.
  # A failing test still fails the command (via `&&`) and blocks the deploy.
  command = "npm run build && SMOKE_BUILD_REUSE_DIR=.vitepress/dist npm run test:ci"
  publish = ".vitepress/dist"

# No NODE_VERSION pin here on purpose: Netlify auto-reads .nvmrc, keeping the
# Node version a single source of truth shared with CI and local `nvm use`.
# (A NODE_VERSION set in the Netlify UI would still override .nvmrc; keep it
# unset there so this file's guarantee holds.)

# Redirect the old /dashboard path (and deep links under it) to the dashboard
# app's own domain. force = true wins over any matching static file.
[[redirects]]
  from = "/dashboard"
  to = "https://dashboard.neonpixels.dev"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "https://dashboard.neonpixels.dev/:splat"
  status = 301
  force = true

# Extensionless URL for the privacy policy page (built by VitePress as
# privacy.html from privacy.md). status = 200 rewrites rather than
# redirecting, so the URL bar stays on /privacy instead of visibly bouncing
# to /privacy.html - this doesn't depend on Netlify's separate "Pretty URLs"
# post-processing setting being enabled.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # Same-origin isolation for this same-origin static site: COOP prevents
    # cross-origin windows from holding a reference to this one (no OAuth-style
    # popup flow exists here to break). CORP: same-origin also blocks this
    # site's own subdomains from loading its sub-resources (stricter than
    # same-site); deliberate for now since no subdomain currently embeds
    # anything from this origin. If a subdomain needs to later, loosen this
    # single value to "same-site" rather than dropping it.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Scoped to what the built site actually loads: self only. Fonts are
    # self-hosted (@fontsource, bundled at build), so no Google Fonts origins.
    # script-src/style-src keep 'unsafe-inline' because VitePress emits inline
    # bootstrap scripts and the components render inline style attributes; this
    # does weaken script-src, so it is a deliberate trade-off, not fully locked.
    # Rollout in progress: the build hashes VitePress's inline scripts (sha256)
    # and publishes a Content-Security-Policy-Report-Only header via a generated
    # `_headers` file (see .vitepress/csp + config.ts buildEnd), which drops
    # 'unsafe-inline' from script-src in report-only mode. This enforcing header
    # stays as-is so nothing breaks if a hash is missed.
    # @todo Once the Report-Only header reports no script-src violations in
    # production, drop 'unsafe-inline' from script-src here to enforce the
    # hashes. style attributes still need 'unsafe-inline' on style-src regardless.
    # Google Analytics (gtag.js) origins follow Google's published CSP guidance
    # (developers.google.com/tag-platform/security/guides/csp): gtag.js loads
    # from googletagmanager.com, and GA4 sends collection beacons to
    # region-scoped *.google-analytics.com / *.analytics.google.com subdomains —
    # hence the wildcards on img-src/connect-src. netlify.test.ts allowlists
    # exactly these three GA wildcard domains; every other wildcard still fails.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; form-action 'self'"

# Production deploys only via the build hook (weekly workflow or manual
# dispatch), so merging to main doesn't deploy. Deploy Previews and branch
# deploys are unaffected: this lives in [context.production] only.
[context.production]
  # Netlify cancels the build when this exits 0 and builds when it exits 1.
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 1; else exit 0; fi"
