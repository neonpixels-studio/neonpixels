name: Weekly production deploy

on:
  schedule:
    # Mondays 14:00 UTC. This cron is the single place the cadence lives.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One deploy trigger at a time; a second run queues rather than cancelling an
# in-flight hook call.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run from another branch must not deploy production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require build hook secret
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::Repository secret NETLIFY_BUILD_HOOK_URL is not set; cannot trigger a production deploy."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history so the 7-day commit check is correct.
          fetch-depth: 0

      - name: Check for commits in the last 7 days
        id: recent
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          recent_commits=$(git rev-list --count --since="7 days ago" origin/main)
          if [ "$recent_commits" -eq 0 ]; then
            echo "main has no commits in the last 7 days; skipping production deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main has $recent_commits commit(s) in the last 7 days."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Trigger production deploy
        if: steps.recent.outputs.skip != 'true'
        run: |
          trigger_title="Manual+production+deploy"
          if [ "$EVENT_NAME" = "schedule" ]; then
            trigger_title="Weekly+production+deploy"
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL?trigger_title=$trigger_title"
