name: Weekly production deploy

on:
  schedule:
    # Mondays 14:00 UTC. This cron is the single place the cadence lives.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One deploy run at a time; a second run queues rather than cancelling an
# in-flight one. The group name is this workflow's own: the reusable deploy
# workflow reserves np-production-deploy-<repo> and np-deploy-failure-issue-<repo>.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Browser gate: the production build on Netlify runs test:ci but no browser,
  # so a change that landed on main can break banner or form hydration
  # unnoticed. The deploy job needs this job, so a red e2e blocks the deploy.
  # It runs every week: whether main is already live is decided inside the
  # shared deploy workflow, after this gate.
  e2e:
    # A manual run from another branch must not deploy production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Shared deploy: decides whether main is newer than the live deploy
  # (np-should-deploy), calls the build hook, and verifies the deploy
  # (np-verify-netlify-deploy). It opens a deploy-failure issue on failure and
  # closes it after a verified deploy, so the calling job grants issues: write.
  # actions: read is required by the decide step inside the reusable workflow.
  # Secrets are passed by name, never with `secrets: inherit`.
  deploy:
    needs: e2e
    # Also guarded by e2e being skipped off main; kept explicit so a later
    # `always()` cannot deploy production from another branch.
    if: github.ref == 'refs/heads/main'
    uses: neonpixels-studio/packages/.github/workflows/production-deploy.yml@46c6ad81803f8b753940ca121214a3e8c7897401 # 2026-11-25 main
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      scripts-version: 0.3.0
    secrets:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
