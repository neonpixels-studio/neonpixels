name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled. Push runs get a per-commit group so no
# main build is ever cancelled or replaced in a queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR-only change detection for the lighthouse job. Gating happens with a
  # job-level `if:` on lighthouse (never workflow-level `paths:`) so a skipped
  # run still reports as passing and `lighthouse` can become a required check.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'index.md'
              - 'privacy.md'
              - 'public/**'
              - '.vitepress/config.ts'
              - '.vitepress/theme/**'
              - '.vitepress/fonts/**'
              - '.vitepress/csp/**'
              - '.vitepress/seo/**'
              - '.vitepress/robots/**'
              - 'package.json'
              - 'package-lock.json'
              - '.lighthouserc.json'
              - '.github/workflows/ci.yml'

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check action pinning
        run: npx np-check-action-pinning

      # Fails on drift in the files synced from the shared templates (.nvmrc,
      # .gitleaks.toml, dependabot.yml, husky hooks, package.json engines).
      # Repo-specific lines belong in the np-sync sections.
      - name: Check synced templates
        run: npx np-sync-templates --stack vitepress --check

      - name: Lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          npm run lint:static
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            npx fallow audit --base "$BASE"
          else
            echo "::warning::fallow audit base unavailable; using auto-detected base"
            npx fallow audit
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The build-html smoke suite reuses the build above instead of compiling a
      # second throwaway copy. It fails loudly if the dist is missing or partial.
      - name: Test
        run: npm run test:ci
        env:
          SMOKE_BUILD_REUSE_DIR: .vitepress/dist

      - name: Internal link check
        run: npm run link:check

      - name: Performance budget
        run: npm run perf:budget

      # Feeds the e2e job. The lighthouse job builds its own copy.
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-build
          path: .vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Real-browser smoke test of the built site (consent banner, contact form)
  # under the production CSP. Chromium only. Reuses the build artifact from the
  # ci job, so it runs on PRs and main pushes and the site is still compiled
  # exactly once per run.
  e2e:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-build
          path: .vitepress/dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Error-level: every assertion in .lighthouserc.json is `error`, so scores
  # below threshold fail the job. Audits the production static build (never a
  # dev server). Google Analytics loads only after cookie consent at runtime,
  # which a fresh Lighthouse profile never grants, so no CONTEXT guard is
  # needed here.
  #
  # Calls the shared reusable workflow. It installs and builds on its own
  # (`build-script`), so it no longer downloads the ci job's build artifact:
  # this costs one extra site build per audited run. Its report job only files
  # issues outside pull requests, and this job is skipped on push, so no
  # issue is ever filed from here.
  lighthouse:
    needs: [ci, changes]
    # Fails closed: a failed or cancelled `changes` job runs the audit instead
    # of skipping it (a skipped required check reads as green). `!cancelled()`
    # drops the implicit success() so the failure branch can be reached; ci must
    # still pass. On push, `changes` is skipped, so the audit skips too.
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success' &&
      (needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
      (needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true')) }}
    uses: neonpixels-studio/packages/.github/workflows/lighthouse.yml@c7becbdbbd7cacf8a4118465166b064931d017d6 # 2026-11-23 main
    permissions:
      contents: read
      issues: write
    with:
      package-manager: npm
      build-script: build
      config-path: ./.lighthouserc.json
      scripts-version: 0.3.0
