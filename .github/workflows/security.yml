name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:23 UTC (off the hour, since GitHub docs flag
    # top-of-hour runs as most likely to be delayed/dropped under load).
    # Catches advisories published against already-merged dependencies
    # between pushes. Note: on public repos (this one), GitHub disables
    # scheduled workflows after 60 days with no repository activity, so
    # this isn't a substitute for a proper alerting backstop (e.g.
    # Dependabot alerts) on a genuinely dormant repo.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Push, schedule, and manual runs get a
# per-run group (not per-commit: schedule and manual runs share main's SHA
# with the push run, and a queued run in a shared group gets replaced), so
# nothing but a superseded PR run is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secret scan from the shared reusable workflow: it scans the pull request
  # commit range, or the full history on a push, with this repo's
  # .gitleaks.toml (synced from the shared template; see np-sync-templates).
  gitleaks:
    # main's history is already scanned in full on every push (pinned
    # gitleaks version), so a scheduled/manual rescan can't surface
    # anything new. The schedule above exists for npm advisories, which
    # only the audit jobs check, so skip gitleaks on those triggers.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: neonpixels-studio/packages/.github/workflows/gitleaks.yml@46c6ad81803f8b753940ca121214a3e8c7897401 # 2026-11-25 main
    permissions:
      contents: read

  # Shared production-dependencies gate. It reads the lockfile and installs
  # nothing from this repo, so no dependency code runs in it. This repo has one
  # production dependency, so the all-dependencies gate in `audit` below is the
  # one that covers the build tooling.
  dependency-audit:
    uses: neonpixels-studio/packages/.github/workflows/dependency-audit.yml@46c6ad81803f8b753940ca121214a3e8c7897401 # 2026-11-25 main
    permissions:
      contents: read
    with:
      package-manager: npm
      scripts-version: 0.3.0

  # All-dependencies gate, kept local because the shared gate's
  # all-dependencies mode (`include-dev`) needs a @neon-pixels/scripts release
  # newer than the 0.3.0 pinned here. @todo Replace this job's gate step with a
  # second `dependency-audit.yml` call using `include-dev: true` once
  # neonpixels-studio/packages#77 is released; keep the check:overrides step
  # either way, it is specific to this repo.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `overrides` in package.json (e.g. brace-expansion -> v5) is applied
      # silently: a future dependency bump that pulls in a consumer declaring
      # an older, incompatible major (minimatch 3 wants brace-expansion ^1)
      # would be forced onto v5 with no install-time or audit signal. This
      # compares each consumer's declared range in package-lock.json against
      # the version actually installed and fails on a mismatch.
      - name: Check overrides do not mask an incompatible major
        run: npm run check:overrides

      - name: Audit summary (report only, never fails)
        run: npm audit || true

      # This is a static site with one production dependency, so almost all real
      # supply-chain exposure lives in devDependencies. Audit the full tree
      # (no --omit=dev) so the gate can actually fail on a high/critical
      # advisory. `npm run audit` runs .github/scripts/audit.sh: the same
      # high/critical gate, minus allowlisted advisories with no upstream fix.
      - name: Audit gate (fail on high or critical advisories)
        run: npm run audit

  # A separate job (rather than a failure step tacked onto `audit`) for two
  # reasons: (1) `audit` runs `npm ci`/`npm audit` over the full dependency
  # tree, including install lifecycle scripts, with GITHUB_TOKEN visible to
  # every process in the job — granting that job `issues: write` would hand
  # issue-create to any malicious postinstall, on the one workflow whose job
  # is to catch malicious dependencies; and (2) a job-level `if: failure()`
  # against `needs` fires on ANY failure in either audit job (checkout, npm
  # ci, a registry blip, or the audit gate itself), not just the gate step,
  # so a scheduled run can't fail silently no matter which step breaks (see
  # issue #109). It needs both the local `audit` job and the shared
  # `dependency-audit` call, so either one failing opens the issue. Scoped to the `schedule` trigger only — a push/pull_request
  # failure is already visible as a failing required check, so opening an
  # issue there would just be noise on top of that.
  notify-audit-failure:
    needs: [audit, dependency-audit]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notify on scheduled audit failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const notifyAuditFailure = require("./.github/scripts/notify-audit-failure.cjs");
            await notifyAuditFailure({ github, context, core });

  # Recovery counterpart to notify-audit-failure: once a scheduled audit
  # succeeds again, close the tracking issue that job opened so resolved
  # failures don't sit open waiting on a human. Split into its own job for
  # the same reason notify-audit-failure is: the `audit` job's GITHUB_TOKEN
  # is visible to every process it runs (including install lifecycle
  # scripts), so `issues: write` stays out of that job and lives only here,
  # scoped to the schedule trigger. Runs on success where notify-audit-failure
  # runs on failure. It closes the issue only when both audit jobs passed:
  # `needs` on both would already skip this job on a failed audit, but the
  # explicit `success()` mirrors notify-audit-failure's explicit `failure()`.
  close-resolved-audit-failure:
    needs: [audit, dependency-audit]
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Close resolved audit-failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const closeResolvedAuditFailure = require("./.github/scripts/close-resolved-audit-failure.cjs");
            await closeResolvedAuditFailure({ github, context, core });
