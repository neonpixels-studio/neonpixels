version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "grimicorn"
    groups:
      # Dependabot assigns each dependency's update to the first group below
      # whose rules match it; an update that matches no group ships as its
      # own solo PR. minor-and-patch is listed first so minor/patch bumps —
      # for vite/vitepress included — keep landing in the general weekly
      # PR exactly as before this change.
      #
      # @tailwindcss/vite, @vitejs/plugin-vue, and vitest peer-depend on vite
      # and often widen that peer range in a MINOR release of their own, not
      # just a major (e.g. vitest 5.1.0 bumping its supported vite range).
      # Without excluding them here, that minor release would still match
      # this catch-all group (it has no `patterns`) and could ship in the
      # general weekly PR the same run a vite major falls through to
      # vite-vitepress below — landing split, with mismatched peer ranges
      # installed together, breaking `npm ci`. Excluding them forces every
      # bump to these three (major, minor, or patch) down into vite-vitepress
      # instead, so they always land in the same run as any pending vite
      # bump.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@tailwindcss/vite"
          - "@vitejs/plugin-vue"
          - "vitest"
      # vite and vitepress are coupled: package.json pins vitepress's bundled
      # vite/esbuild via `overrides.vitepress.{vite,esbuild}` (see the
      # comment in .vitepress/config.ts). Dependabot can only bump manifest
      # entries — it never touches that nested overrides block — so this
      # grouping doesn't update the pin itself, and it only bundles updates
      # that land in the same run (if only one of the two has a release
      # pending, it still ships alone). What it buys: a *major* bump to
      # either package now falls through minor-and-patch (which excludes
      # majors) into this group instead of shipping as its own unremarkable
      # solo PR, making it obvious a human should check whether the override
      # still needs adjusting. No `update-types` filter here, so this group
      # would also catch a minor/patch bump if it somehow fell through
      # minor-and-patch above it.
      #
      # @tailwindcss/vite, @vitejs/plugin-vue, and vitest all declare vite as
      # a peer dependency (see the exclude-patterns note on minor-and-patch
      # above for why their minor/patch releases land here too). Grouping
      # them with vite means: whenever vite has a pending update in the same
      # Dependabot run, these three land in that same PR rather than a
      # separate one with a stale peer range. If none of them has an update
      # pending that run, they simply don't appear — this group doesn't
      # force a bump that isn't otherwise available.
      vite-vitepress:
        patterns:
          - "vite"
          - "vitepress"
          - "@tailwindcss/vite"
          - "@vitejs/plugin-vue"
          - "vitest"
      # A group's patterns only apply to scheduled version updates unless
      # `applies-to: security-updates` is set — the two can't share one
      # group. Without this, a security-triggered vite/vitepress bump would
      # still ship solo, missing the whole point above.
      vite-vitepress-security:
        applies-to: security-updates
        patterns:
          - "vite"
          - "vitepress"
          - "@tailwindcss/vite"
          - "@vitejs/plugin-vue"
          - "vitest"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "grimicorn"
